<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="1000" height="1000" shape-rendering="geometricPrecision">
  <defs>
    <!-- Gradiente suave do disco circular ciano/água -->
    <radialGradient id="discBg" cx="55%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f2fffd" />
      <stop offset="55%" stop-color="#dcfaef" />
      <stop offset="100%" stop-color="#c9f3f8" />
    </radialGradient>

    <!-- Borda azul suave do disco -->
    <linearGradient id="discBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fd3f4" />
      <stop offset="50%" stop-color="#69bce8" />
      <stop offset="100%" stop-color="#8fd3f4" />
    </linearGradient>

    <!-- Cabelo castanho escuro suave -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c221b" />
      <stop offset="60%" stop-color="#331d17" />
      <stop offset="100%" stop-color="#281510" />
    </linearGradient>

    <!-- Pele suave com leve sombreado -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe1cc" />
      <stop offset="75%" stop-color="#fdd5ba" />
      <stop offset="100%" stop-color="#f7c4a5" />
    </linearGradient>

    <!-- Pijama cirúrgico azul médico -->
    <linearGradient id="scrubBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Jaleco branco limpo com sombreado sutil -->
    <linearGradient id="coatWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f7" />
    </linearGradient>

    <!-- Campânula metálica do estetoscópio -->
    <radialGradient id="metalDisc" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="65%" stop-color="#b0bec5" />
      <stop offset="100%" stop-color="#78909c" />
    </radialGradient>

    <!-- Clip circular perfeito para corpo e borda inferior -->
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="242" />
    </clipPath>
  </defs>

  <!-- 1. DISCO DE FUNDO CIRCULAR CIANO -->
  <circle cx="250" cy="250" r="244" fill="url(#discBg)" stroke="url(#discBorder)" stroke-width="5" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#89c9ec" stroke-width="2" stroke-dasharray="7 10" opacity="0.85" />

  <!-- CONTEÚDO RECORTADO DENTRO DO CÍRCULO -->
  <g clip-path="url(#circleClip)">
    <!-- 2. CABELO TRASEIRO E LATERAL (Formato exato suave e natural) -->
    <path d="M 250 116
             C 192 116, 152 156, 150 222
             C 148 258, 156 286, 152 316
             C 146 346, 128 364, 132 390
             C 135 408, 152 418, 174 416
             L 326 416
             C 348 418, 365 408, 368 390
             C 372 364, 354 346, 348 316
             C 344 286, 352 258, 350 222
             C 348 156, 308 116, 250 116 Z"
          fill="url(#hairGrad)" />

    <!-- 3. CORPO: PIJAMA CIRÚRGICO AZUL E JALECO BRANCO -->
    <!-- Base azul do pijama cirúrgico -->
    <path d="M 188 308 L 312 308 L 348 500 L 152 500 Z" fill="url(#scrubBlue)" />
    <!-- Detalhe gola V limpa do pijama -->
    <path d="M 224 306 L 250 350 L 276 306 Z" fill="#f7c4a5" />
    <!-- Costura central sutil do scrub -->
    <path d="M 239 354 L 261 354 L 258 408 L 242 408 Z" fill="#0369a1" opacity="0.55" />

    <!-- Jaleco Branco - Lado Esquerdo -->
    <path d="M 206 306
             C 162 322, 138 386, 132 500
             L 194 500
             L 234 402
             L 206 306 Z"
          fill="url(#coatWhite)" stroke="#d8e2ec" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Jaleco Branco - Lado Direito -->
    <path d="M 294 306
             C 338 322, 362 386, 368 500
             L 306 500
             L 266 402
             L 294 306 Z"
          fill="url(#coatWhite)" stroke="#d8e2ec" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Lapelas internas sutis do jaleco -->
    <path d="M 206 306 L 238 396 L 222 406 L 194 320 Z" fill="#eef4fa" stroke="#d5e0eb" stroke-width="1" />
    <path d="M 294 306 L 262 396 L 278 406 L 306 320 Z" fill="#eef4fa" stroke="#d5e0eb" stroke-width="1" />

    <!-- 4. PESCOÇO -->
    <path d="M 229 282 L 271 282 L 271 314 C 271 324, 229 324, 229 314 Z" fill="#f5be9d" />

    <!-- 5. ROSTO (Oval delicado e simpático) -->
    <ellipse cx="250" cy="227" rx="71" ry="75" fill="url(#skinGrad)" />

    <!-- Bochechas rosadas -->
    <circle cx="209" cy="242" r="12.5" fill="#f69c9e" opacity="0.72" />
    <circle cx="291" cy="242" r="12.5" fill="#f69c9e" opacity="0.72" />

    <!-- Sobrancelhas delicadas -->
    <path d="M 210 201 Q 223 194 236 200" fill="none" stroke="#331d17" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 264 200 Q 277 194 290 201" fill="none" stroke="#331d17" stroke-width="3.2" stroke-linecap="round" />

    <!-- Olhos expressivos com brilho branco -->
    <g id="leftEye">
      <ellipse cx="223.5" cy="217.5" rx="7" ry="7.4" fill="#231614" />
      <circle cx="221" cy="214.5" r="2.4" fill="#ffffff" />
    </g>
    <g id="rightEye">
      <ellipse cx="276.5" cy="217.5" rx="7" ry="7.4" fill="#231614" />
      <circle cx="274" cy="214.5" r="2.4" fill="#ffffff" />
    </g>

    <!-- Narizinho delicado -->
    <path d="M 250 223 L 251 238 Q 251.5 243 245 243.5" fill="none" stroke="#d19877" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sorriso acolhedor -->
    <path d="M 234 264 Q 250 279 266 264" fill="none" stroke="#c8175a" stroke-width="4.2" stroke-linecap="round" />

    <!-- 6. FRANJA LATERAL ASSIMÉTRICA (Exatamente como a referência) -->
    <path d="M 174 222
             C 172 158, 206 122, 252 122
             C 298 122, 330 158, 326 222
             C 320 198, 302 184, 280 156
             C 262 178, 224 190, 198 194
             C 184 196, 178 208, 174 222 Z"
          fill="url(#hairGrad)" />

    <!-- 7. ESTETOSCÓPIO -->
    <!-- Tubo esquerdo -->
    <path d="M 183 316 C 182 365, 196 410, 222 432"
          fill="none" stroke="#3b4a5e" stroke-width="7.5" stroke-linecap="round" />
    <!-- Tubo direito -->
    <path d="M 317 316 C 318 365, 302 418, 250 437"
          fill="none" stroke="#3b4a5e" stroke-width="7.5" stroke-linecap="round" />
    <!-- Diafragma / Campânula metálica -->
    <g transform="translate(234, 439)">
      <circle cx="0" cy="0" r="19" fill="#475569" />
      <circle cx="0" cy="0" r="15.5" fill="url(#metalDisc)" />
      <circle cx="0" cy="0" r="10.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
    </g>

    <!-- 8. CRACHÁ MÉDICO NO JALECO -->
    <g transform="translate(291, 380)">
      <rect x="0" y="0" width="52" height="34" rx="5" fill="#ffffff" stroke="#2c7bb6" stroke-width="2" />
      <rect x="7" y="7" width="38" height="5" rx="2.5" fill="#1d85c4" />
      <rect x="7" y="16" width="27" height="3.5" rx="1.75" fill="#94a3b8" />
      <rect x="7" y="23" width="18" height="3.5" rx="1.75" fill="#94a3b8" />
    </g>
  </g>
</svg>
