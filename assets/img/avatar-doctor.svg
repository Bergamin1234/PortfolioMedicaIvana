<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550">
  <defs>
    <!-- Background Radial Gradient (Soft Medical Glow) -->
    <radialGradient id="bgCircle" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="85%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </radialGradient>

    <!-- Hair Realistic Shading Gradient (Castanho Iluminado Natural) -->
    <linearGradient id="hairBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382115" />
      <stop offset="40%" stop-color="#2a160c" />
      <stop offset="100%" stop-color="#180b06" />
    </linearGradient>

    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3825" />
      <stop offset="50%" stop-color="#784930" />
      <stop offset="100%" stop-color="#4a2c1b" />
    </linearGradient>

    <linearGradient id="hairGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a563a" />
      <stop offset="100%" stop-color="#382115" />
    </linearGradient>

    <!-- Skin Harmonious Soft Gradient -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3ed" />
      <stop offset="50%" stop-color="#fde5d8" />
      <stop offset="100%" stop-color="#f8cebe" />
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4bcab" />
      <stop offset="100%" stop-color="#e29f8c" />
    </linearGradient>

    <!-- Coat Gradient (White with clean medical shading) -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="coatShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Scrub Gradient (Teal/Navy Modern Scrub) -->
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Metallic Stethoscope Gradient -->
    <linearGradient id="stethMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Elegant Backdrop Frame -->
  <circle cx="250" cy="245" r="200" fill="url(#bgCircle)" />
  <circle cx="250" cy="245" r="198" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85" />
  <circle cx="250" cy="245" r="185" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Subtle Medical Ambient Sparkles -->
  <circle cx="100" cy="140" r="3" fill="#38bdf8" opacity="0.6" />
  <path d="M 100 133 L 100 147 M 93 140 L 107 140" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  <circle cx="400" cy="150" r="3" fill="#38bdf8" opacity="0.6" />
  <path d="M 400 143 L 400 157 M 393 150 L 407 150" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- ================= DOCTOR 2D CHARACTER: DRA. IVANA BERGAMIN ================= -->

  <!-- 1. BACK HAIR (Cabelo longo solto, ondulado e natural caindo atrás dos ombros) -->
  <g id="backHair">
    <!-- Base hair mass -->
    <path d="M 175 160 C 135 220 125 320 145 425 C 170 380 185 320 190 280 Z" fill="url(#hairBase)" />
    <path d="M 325 160 C 365 220 375 320 355 425 C 330 380 315 320 310 280 Z" fill="url(#hairBase)" />
    <!-- Center volume connecting behind neck -->
    <path d="M 160 170 C 150 260 160 360 210 400 L 290 400 C 340 360 350 260 340 170 Z" fill="url(#hairBase)" />
    <!-- Soft wave highlights in back -->
    <path d="M 140 260 C 135 320 145 380 155 420 C 160 370 165 310 165 270 Z" fill="url(#hairHighlight)" opacity="0.7" />
    <path d="M 360 260 C 365 320 355 380 345 420 C 340 370 335 310 335 270 Z" fill="url(#hairHighlight)" opacity="0.7" />
  </g>

  <!-- 2. BODY & MEDICAL ATTIRE -->
  <!-- Scrub Base (Pijama cirúrgico azul-petróleo moderno) -->
  <path d="M 180 310 L 320 310 L 350 535 L 150 535 Z" fill="url(#scrubGrad)" />
  
  <!-- Scrub V-Neck with layered collar -->
  <path d="M 220 310 L 250 360 L 280 310 Z" fill="#e0f2fe" opacity="0.4" />
  <path d="M 224 310 L 250 355 L 276 310 Z" fill="#f8fafc" />

  <!-- White Lab Coat (Jaleco Médico Impecável) -->
  <!-- Coat Left Side -->
  <path d="M 125 535 C 120 420 150 330 195 305 L 235 415 L 175 535 Z" fill="url(#coatGrad)" filter="url(#softShadow)" />
  <!-- Coat Right Side -->
  <path d="M 375 535 C 380 420 350 330 305 305 L 265 415 L 325 535 Z" fill="url(#coatGrad)" filter="url(#softShadow)" />

  <!-- Coat Lapels (Lapelas clássicas com corte italiano) -->
  <path d="M 195 305 L 240 410 L 200 410 L 165 330 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <path d="M 305 305 L 260 410 L 300 410 L 335 330 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- Coat Seam & Pearl Buttons -->
  <line x1="250" y1="410" x2="250" y2="535" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="250" cy="445" r="4.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
  <circle cx="250" cy="495" r="4.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />

  <!-- Doctor ID Badge (Crachá Médico da Dra. Ivana Bergamin) -->
  <g transform="translate(295, 385)">
    <rect width="46" height="30" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.12))" />
    <rect x="3" y="4" width="40" height="5" rx="2" fill="#0284c7" />
    <circle cx="10" cy="18" r="5" fill="#bae6fd" />
    <line x1="18" y1="16" x2="40" y2="16" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="21" x2="32" y2="21" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- 3. STETHOSCOPE (Anatomically draped around neck) -->
  <!-- Tubing Left -->
  <path d="M 212 295 C 196 355 220 415 240 422" fill="none" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 212 295 C 196 355 220 415 240 422" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  
  <!-- Tubing Right -->
  <path d="M 288 295 C 304 355 280 415 260 422" fill="none" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 288 295 C 304 355 280 415 260 422" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Chestpiece (Campânula e diafragma duplo em aço cirúrgico) -->
  <g transform="translate(250, 428)">
    <circle cx="0" cy="0" r="14" fill="url(#stethMetal)" stroke="#1e293b" stroke-width="2" />
    <circle cx="0" cy="0" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
    <circle cx="0" cy="0" r="3.5" fill="#0284c7" />
  </g>

  <!-- 4. NECK & HEAD -->
  <!-- Neck -->
  <path d="M 230 235 L 230 305 C 230 315 270 315 270 305 L 270 235 Z" fill="url(#skinBase)" />
  <path d="M 230 270 C 242 285 258 285 270 270 Z" fill="url(#skinShadow)" opacity="0.65" />

  <!-- Feminine Delicate Head Contour -->
  <path d="M 200 185 C 198 245 212 268 250 268 C 288 268 302 245 300 185 C 298 135 284 112 250 112 C 216 112 202 135 200 185 Z" 
        fill="url(#skinBase)" filter="url(#softShadow)" />

  <!-- Ears & Pearl Earrings -->
  <path d="M 198 185 C 192 185 192 212 199 217 Z" fill="url(#skinBase)" />
  <path d="M 302 185 C 308 185 308 212 301 217 Z" fill="url(#skinBase)" />
  <!-- Pearl Studs -->
  <circle cx="196" cy="208" r="2.8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
  <circle cx="195" cy="207" r="1" fill="#ffffff" />
  <circle cx="304" cy="208" r="2.8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
  <circle cx="303" cy="207" r="1" fill="#ffffff" />

  <!-- 5. FACIAL FEATURES (Harmonious, gentle, intelligent expression) -->
  <!-- Natural Eyebrows (Sobrancelhas arqueadas elegantes) -->
  <path d="M 215 168 Q 226 160 239 165" fill="none" stroke="#2a160c" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 261 165 Q 274 160 285 168" fill="none" stroke="#2a160c" stroke-width="2.6" stroke-linecap="round" />

  <!-- Eyes (Olhos expressivos amendoados castanho-claros) -->
  <!-- Left Eye -->
  <ellipse cx="227" cy="180" rx="9" ry="6.2" fill="#ffffff" />
  <ellipse cx="227.5" cy="180" rx="5.4" ry="5.4" fill="#4a2c1b" />
  <circle cx="228" cy="180" r="3" fill="#180b06" />
  <circle cx="225.5" cy="178" r="1.8" fill="#ffffff" />
  <circle cx="229.5" cy="181.5" r="0.9" fill="#ffffff" />
  <!-- Upper Eyelid & Lashes -->
  <path d="M 217 179 Q 227 172 237 178" fill="none" stroke="#180b06" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 236 177 L 239 174" stroke="#180b06" stroke-width="1.4" stroke-linecap="round" />

  <!-- Right Eye -->
  <ellipse cx="273" cy="180" rx="9" ry="6.2" fill="#ffffff" />
  <ellipse cx="272.5" cy="180" rx="5.4" ry="5.4" fill="#4a2c1b" />
  <circle cx="272" cy="180" r="3" fill="#180b06" />
  <circle cx="274.5" cy="178" r="1.8" fill="#ffffff" />
  <circle cx="270.5" cy="181.5" r="0.9" fill="#ffffff" />
  <!-- Upper Eyelid & Lashes -->
  <path d="M 263 178 Q 273 172 283 179" fill="none" stroke="#180b06" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 282 177 L 285 174" stroke="#180b06" stroke-width="1.4" stroke-linecap="round" />

  <!-- Delicate Feminine Nose -->
  <path d="M 250 178 L 251 198 Q 251 204 247 205 Q 251 206 253 204" fill="none" stroke="#d38b6d" stroke-width="1.8" stroke-linecap="round" />

  <!-- Soft Rose Cheek Blush -->
  <ellipse cx="217" cy="198" rx="11" ry="6.5" fill="#f43f5e" opacity="0.14" />
  <ellipse cx="283" cy="198" rx="11" ry="6.5" fill="#f43f5e" opacity="0.14" />

  <!-- Warm, Welcoming Doctor's Smile -->
  <path d="M 238 227 Q 250 236 262 227" fill="none" stroke="#be185d" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 240 226 Q 250 222 260 226 Q 250 234 240 226 Z" fill="#e11d48" opacity="0.3" />

  <!-- 6. FRONT FLOWING HAIR (Ondas soltas elegantes que contornam o rosto e caem nos ombros) -->
  <g id="frontHair">
    <!-- Top Hair Volume & Natural Parting (Parted slightly to the left) -->
    <path d="M 197 175 C 194 105 222 86 250 86 C 278 86 306 105 303 175 C 292 120 268 102 248 102 C 228 102 208 120 197 175 Z" fill="url(#hairBase)" />
    
    <!-- Parting Line & Gloss Sheen on Crown -->
    <path d="M 228 97 Q 248 92 268 97" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 240 92 Q 244 102 246 112" fill="none" stroke="#5a3825" stroke-width="1.5" opacity="0.8" />

    <!-- Left Front Wave Cascading smoothly over shoulder (Natural, NO pigtails!) -->
    <path d="M 203 155 C 188 190 186 250 196 310 C 204 355 192 390 180 420 C 172 385 174 340 182 290 C 188 240 190 190 203 155 Z" 
          fill="url(#hairHighlight)" />
    <path d="M 210 120 C 228 108 244 108 246 115 C 235 125 218 145 206 175 C 196 220 200 270 208 310 C 202 265 198 215 210 120 Z" 
          fill="url(#hairBase)" />
    <!-- Left Strand Highlight -->
    <path d="M 195 240 C 190 290 198 340 190 385" fill="none" stroke="#8a563a" stroke-width="2" stroke-linecap="round" opacity="0.65" />

    <!-- Right Front Wave Cascading smoothly over shoulder -->
    <path d="M 297 155 C 312 190 314 250 304 310 C 296 355 308 390 320 420 C 328 385 326 340 318 290 C 312 240 310 190 297 155 Z" 
          fill="url(#hairHighlight)" />
    <path d="M 246 115 C 255 108 272 108 290 120 C 302 215 298 265 292 310 C 300 270 304 220 294 175 C 282 145 265 125 246 115 Z" 
          fill="url(#hairBase)" />
    <!-- Right Strand Highlight -->
    <path d="M 305 240 C 310 290 302 340 310 385" fill="none" stroke="#8a563a" stroke-width="2" stroke-linecap="round" opacity="0.65" />
  </g>
</svg>