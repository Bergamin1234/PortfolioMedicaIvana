<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Hexagonal / Shield Luxury Silhouette -->
  <rect x="4" y="4" width="72" height="72" rx="22" fill="url(#crestGrad)" filter="url(#glow)" />
  <rect x="6" y="6" width="68" height="68" rx="20" fill="none" stroke="url(#goldRim)" stroke-width="2" opacity="0.8" />

  <!-- Medical Cross Subtle Background -->
  <path d="M40 18 v44 M18 40 h44" stroke="rgba(255,255,255,0.18)" stroke-width="6" stroke-linecap="round" />

  <!-- Luxury Monogram "IB" -->
  <text x="40" y="49" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        fill="#ffffff" 
        letter-spacing="-1.5" 
        text-anchor="middle">
    IB
  </text>

  <!-- Tiny Golden Stethoscope Accent / Star -->
  <circle cx="56" cy="24" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
</svg>
