<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Glowing background elements -->
  <circle cx="250" cy="200" r="160" fill="url(#glowGrad)" />
  <circle cx="250" cy="200" r="120" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3" />

  <!-- DNA Double Helix Helix abstract curves -->
  <path d="M100 120 Q 150 160 200 120 T 300 120 T 400 120" fill="none" stroke="#0284c7" stroke-width="2.5" opacity="0.35" />
  <path d="M100 160 Q 150 120 200 160 T 300 160 T 400 160" fill="none" stroke="#0d9488" stroke-width="2.5" opacity="0.35" />
  <line x1="150" y1="135" x2="150" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <line x1="250" y1="135" x2="250" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <line x1="350" y1="135" x2="350" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Heart Pulse ECG Line -->
  <path d="M50 240 L160 240 L180 210 L195 280 L215 170 L235 295 L250 225 L265 250 L280 240 L450 240" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Circular floating medical cards -->
  <g transform="translate(80, 260)">
    <rect width="130" height="60" rx="14" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(15,23,42,0.08))" stroke="#e2e8f0" />
    <circle cx="28" cy="30" r="16" fill="#e0f2fe" />
    <path d="M28 22 v16 M20 30 h16" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <text x="52" y="27" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Atenção Primária</text>
    <text x="52" y="43" font-family="sans-serif" font-size="9" fill="#64748b">Saúde da Família</text>
  </g>

  <g transform="translate(290, 70)">
    <rect width="135" height="60" rx="14" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(15,23,42,0.08))" stroke="#e2e8f0" />
    <circle cx="28" cy="30" r="16" fill="#ccfbf1" />
    <circle cx="28" cy="30" r="7" fill="none" stroke="#0f766e" stroke-width="2" />
    <line x1="33" y1="35" x2="40" y2="42" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" />
    <text x="52" y="27" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Visão Diagnóstica</text>
    <text x="52" y="43" font-family="sans-serif" font-size="9" fill="#64748b">Biomedicina + Medicina</text>
  </g>

  <g transform="translate(300, 270)">
    <rect width="140" height="60" rx="14" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(15,23,42,0.08))" stroke="#e2e8f0" />
    <circle cx="28" cy="30" r="16" fill="#fef3c7" />
    <polygon points="28,21 30.5,26.5 36.5,27.3 32.2,31.5 33.2,37.5 28,34.5 22.8,37.5 23.8,31.5 19.5,27.3 25.5,26.5" fill="#f59e0b" />
    <text x="52" y="27" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Produção Científica</text>
    <text x="52" y="43" font-family="sans-serif" font-size="9" fill="#64748b">BJHR, Lattes & Eventos</text>
  </g>
</svg>
